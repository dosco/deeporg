name: Build

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/**"
      - "website/**"
  # Runs every job, whatever changed. Pushes that only touch workflows don't
  # trigger Build, so this is how a workflow change gets its first run.
  # Auto Release only follows push runs, so a manual run never releases.
  workflow_dispatch:

# Every suite is its own job so they run side by side. As one job the database
# suites ran two at a time and the package tests waited for all of them: ~57
# minutes. Now the run takes as long as its slowest job.
#
# Auto Release waits for this whole workflow to succeed, so every job here
# gates a release. A job skipped because nothing it tests changed counts as
# success.

env:
  # Explicit so every job, and every script under it, builds into the cached
  # directory (scripts/test-redshift.sh otherwise defaults it to /tmp).
  GOCACHE: /home/runner/.cache/go-build
  GOMODCACHE: /home/runner/go/pkg/mod

# Build caches: each job compiles a -race test binary, which takes 2-4 minutes
# cold. setup-go's built-in cache keeps one entry for every job, saved by
# whichever job finishes first (the plain `make build`), so no test build was
# ever cached. Instead each kind of build has its own entry, keyed on the
# dependency set and saved once per dependency change; jobs that compile the
# same binary share one. Changes to GraphJin's own packages still recompile,
# the third-party packages do not.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Everything the tests/ module compiles in. Regenerate with:
            #   go list -deps -test -tags "mysql mariadb mssql sqlite fts5" ./tests | grep dosco/graphjin
            # tests/ imports serv/v3, which pulls in agent, auth and codesql,
            # so a change to any of them can break a database suite.
            db:
              - "core/**"
              - "conf/**"
              - "serv/**"
              - "agent/**"
              - "auth/**"
              - "codesql/**"
              - "plugin/**"
              - "mongodriver/**"
              - "bigquerydriver/**"
              - "cassandradriver/**"
              - "clickhousedriver/**"
              - "tests/**"
              - "go.work"
              - "go.work.sum"
              - "Makefile"
              - "scripts/test-*.sh"
              - ".github/workflows/build.yml"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: ${{ runner.os }}-go-build-

      - name: Build
        run: make build

  packages:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-pkg-race-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: ${{ runner.os }}-go-pkg-race-

      - name: Run package tests (all but cmd)
        run: make test-packages-except-cmd

  cmd:
    name: cmd tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep the count in step with CMD_SHARDS in the Makefile.
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-cmd-race-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: ${{ runner.os }}-go-cmd-race-

      - name: Run cmd tests, shard ${{ matrix.shard }}
        run: make test-cmd-shard SHARD=${{ matrix.shard }} CMD_SHARDS=3

  database:
    name: DB ${{ matrix.db }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One failing database must not cancel the others' results.
      fail-fast: false
      matrix:
        # Keep in step with ALL_DBS in scripts/test-parallel.sh. `cache` names
        # the build: suites without build tags compile the same test binary and
        # share an entry; tagged suites each compile their own.
        include:
          - { db: postgres, cache: db }
          - { db: oracle, cache: db }
          - { db: mongodb, cache: db }
          - { db: cassandra, cache: db }
          - { db: clickhouse, cache: db }
          - { db: snowflake, cache: db }
          - { db: bigquery, cache: db }
          - { db: redshift, cache: db }
          - { db: mysql, cache: db-mysql }
          - { db: mariadb, cache: db-mariadb }
          - { db: sqlite, cache: db-sqlite }
          - { db: mssql, cache: db-mssql }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.cache }}-race-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ matrix.cache }}-race-

      - name: Run ${{ matrix.db }} tests
        run: make test-db DB=${{ matrix.db }}
