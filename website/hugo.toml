baseURL = "https://deeporg.io/"
locale = "en-us"
title = "DeepORG"
disableKinds = ["taxonomy", "term"]
enableGitInfo = false
relativeURLs = false
canonifyURLs = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "DeepORG puts AI agents to work on the systems your company already runs — databases, APIs, files and code — without rebuilding them, on an open-source engine that compiles each request into queries under your access rules."
  home_seo_title = "DeepORG — AI Agents for the Company You Already Run: databases, APIs, files, and code"
  github = "https://github.com/dosco/deeporg"
  install = "curl -fsSL https://deeporg.io/install.sh | bash"

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "../VISION.md"
  target = "assets/root-docs/vision.md"

[[module.mounts]]
  source = "../SECURITY.md"
  target = "assets/root-docs/security.md"

[[module.mounts]]
  source = "../AGENTIC.md"
  target = "assets/root-docs/agentic.md"

[[module.mounts]]
  source = "assets"
  target = "assets"
